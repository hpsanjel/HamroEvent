<!DOCTYPE html>
<html>
<head>
    <title>Test Page Load</title>
</head>
<body>
    <h1>Testing Page Load</h1>
    <p>If you can see this, the basic HTML is loading.</p>
    <p>Now testing the app...</p>
    
    <script>
        // Test if we can access the app
        fetch('http://localhost:5174/app')
            .then(response => response.text())
            .then(html => {
                console.log('App HTML loaded successfully');
                document.getElementById('result').innerHTML = '✅ App HTML loaded successfully';
            })
            .catch(error => {
                console.error('Error loading app:', error);
                document.getElementById('result').innerHTML = '❌ Error loading app: ' + error.message;
            });
    </script>
    
    <div id="result">Loading...</div>
</body>
</html>
